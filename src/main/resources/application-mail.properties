# Opt-in outbound mail. Activate by adding `mail` to the profile list:
# SPRING_PROFILES_ACTIVE=dev,mail. Kept out of application-dev.properties because Boot has no
# "activate on property": spring.mail.host=${MAIL_HOST} is unresolvable when MAIL_HOST is unset,
# and ${MAIL_HOST:} is worse — Boot builds a JavaMailSender whenever the key is present at all,
# empty included, selecting SMTP with nowhere to connect. A profile is absent or complete.
#
# Never pass these to a container as dotted property names. An environment variable literally
# named spring.mail.host satisfies Environment.getProperty — so the autoconfiguration switches
# on — but MailProperties binds through the Binder, which reads a SystemEnvironmentPropertySource
# as SPRING_MAIL_HOST and finds nothing: a JavaMailSender with a null host. Use MAIL_* below.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# JavaMail's default socket timeouts are infinite. The otp.send consumer runs on one thread, so a
# single hung SMTP connection would block every OTP behind it until the provider came back.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# The container healthcheck hits /actuator/health every 10 s, and with a JavaMailSender present
# Boot registers a mail indicator that opens a real SMTP session on each call. Six handshakes a
# minute to an external provider is a cost with no reader (show-details=never); a broken SMTP
# still surfaces where it matters, in the otp.send.dlq queue.
management.health.mail.enabled=false

# Real delivery means the code must stop appearing in the log (OWASP A09). Overrides the dev
# profile's true, because a later profile in the list wins.
app.email.log-codes=false
