# Production profile. Every value comes from the environment; no defaults, no secrets here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=true

# Mail is mandatory in production: without it no account can ever be verified. The app failing to
# start on a missing value is the point.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.email.log-codes=false

# Storage is mandatory and explicit in production. Left to the base file's default this would
# fall back to the container's local disk, where uploads survive exactly until the next deploy.
app.storage.driver=${FILESYSTEM_DISK}

# Swagger UI is a development affordance; it stays off in production (OWASP A02).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
