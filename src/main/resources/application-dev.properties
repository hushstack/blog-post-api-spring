# Local development profile. Activate with: --spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_blog_post_api_spring}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# ddl-auto is inherited from application.properties (validate). A schema change starts with a new
# V<n>__*.sql under db/migration, not with Hibernate rewriting the tables underneath you.
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Dev-only fallback so the app boots without an env var. Production supplies a real secret.
app.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-32bytes+}

# Prints OTP codes at DEBUG when no SMTP host is configured, so registration can be completed
# locally. Local development only — never set this in a deployed environment (OWASP A09).
app.email.log-codes=true
logging.level.com.cachewraith.blog_post_api_spring.integration.email=DEBUG

# spring.mail.host is deliberately absent: Boot creates a JavaMailSender whenever that property is
# present at all — an empty value included — which would select the SMTP sender with nowhere to
# connect. Set it explicitly here when you want dev to send for real.

# Put the exception class and message on 500 responses. Dev only: the base file does not set it
# and prod must not — an exception message can name a table, a path or a host (OWASP A02, A09).
app.errors.expose-details=true
