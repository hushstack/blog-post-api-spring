spring.application.name=blog-post-api-spring

# Profiles: dev (local defaults) / prod (environment-supplied). Nothing secret belongs in this file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Local credentials come from an untracked .env in the project root, parsed as a properties file.
# optional: so the app still starts where there is no such file — a container or CI supplies the
# same names as real environment variables instead, and those take precedence over this.
spring.config.import=optional:file:.env[.properties]

# Flyway owns the schema in every profile; Hibernate only checks that the entities still match it.
# Never set ddl-auto=update here — two things writing DDL is how a database drifts away from its
# migrations without anyone noticing.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# Health only. Widening this list puts the extra endpoints behind the security chain, so authorize
# them deliberately before exposing anything else (OWASP A02).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI, at /swagger-ui.html. Development affordance only — application-prod.properties
# turns springdoc off entirely, so none of this reaches a deployed environment (OWASP A02).
springdoc.swagger-ui.path=/swagger-ui.html
# Keeps the bearer token across page reloads, in browser localStorage. That is a real place for a
# token to sit, which is precisely why it is scoped to the profiles where the UI exists at all.
springdoc.swagger-ui.persist-authorization=true
# 35 operations: collapsed by default, grouped by tag, and each tag ordered by method.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
# Stable key order, so a diff of /v3/api-docs shows real changes rather than reshuffling.
springdoc.writer-with-order-by-keys=true

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=blog-post-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Storage backend: local (filesystem) or r2 (Cloudflare R2 over its S3-compatible API). The
# app.storage.r2.* values are only read when the driver is r2, and StorageConfig then refuses to
# start if any of them is missing rather than falling back to a disk that a deploy would wipe.
app.storage.driver=${FILESYSTEM_DISK:local}

app.storage.base-path=${STORAGE_PATH:./uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_URL:http://localhost:8080/files}
app.storage.max-file-size-bytes=5242880

# R2 credentials are secrets and belong in the environment, never in this file (OWASP A04).
# endpoint is the private S3 API host and carries no bucket name; public-url is the r2.dev or
# custom domain that stored URLs are built from and the only one a client ever sees.
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.public-url=${R2_URL:}
app.storage.r2.path-style-access=${R2_USE_PATH_STYLE_ENDPOINT:true}

app.share.base-url=${SHARE_BASE_URL:http://localhost:8080}

# Outbound mail. With no spring.mail.host set, no JavaMailSender bean exists and EmailConfig falls
# back to the no-delivery implementation — the app still boots, but no OTP reaches anyone.
app.email.from=${MAIL_FROM:no-reply@localhost}
app.email.app-name=Blog
app.email.otp-ttl-minutes=10

# Nightly purge of the otp_verifications audit trail. Nothing else deletes those rows.
app.cleanup.otp-retention-days=30
app.cleanup.otp-cron=0 15 3 * * *
