spring.application.name=blog-post-api-spring

# Profiles: dev (local defaults) / prod (environment-supplied). Nothing secret belongs in this file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Flyway owns the schema in every profile; Hibernate only checks that the entities still match it.
# Never set ddl-auto=update here — two things writing DDL is how a database drifts away from its
# migrations without anyone noticing.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# Health only. Widening this list puts the extra endpoints behind the security chain, so authorize
# them deliberately before exposing anything else (OWASP A02).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=blog-post-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.storage.base-path=${STORAGE_PATH:./uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_URL:http://localhost:8080/files}
app.storage.max-file-size-bytes=5242880

app.share.base-url=${SHARE_BASE_URL:http://localhost:8080}

# Outbound mail. With no spring.mail.host set, no JavaMailSender bean exists and EmailConfig falls
# back to the no-delivery implementation — the app still boots, but no OTP reaches anyone.
app.email.from=${MAIL_FROM:no-reply@localhost}
app.email.app-name=Blog
app.email.otp-ttl-minutes=10

# Nightly purge of the otp_verifications audit trail. Nothing else deletes those rows.
app.cleanup.otp-retention-days=30
app.cleanup.otp-cron=0 15 3 * * *
